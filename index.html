<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashGames0 | Play Free Browser Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0c10; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #1f2833; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; color: #4630f5; text-transform: uppercase; letter-spacing: 1px; }
        .notice-bar { background: #ff007f; color: white; text-align: center; padding: 8px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1400px; margin: 0 auto; }
        .tile { background-color: #1f2833; aspect-ratio: 1; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; padding: 10px; text-decoration: none; color: white; font-weight: bold; font-size: 13px; transition: transform 0.2s, border-color 0.2s; background-size: cover; background-position: center; border: 2px solid transparent; }
        .tile:hover { transform: scale(1.05); border-color: #4630f5; box-shadow: 0 5px 15px rgba(70, 48, 245, 0.3); }
        .tile span { background: rgba(0, 0, 0, 0.7); width: 100%; text-align: center; padding: 5px 0; border-radius: 6px; }
        .big { grid-column: span 2; grid-row: span 2; }
    </style>
</head>
<body>

    <!-- Backup Notice Link for your players -->
    <div class="notice-bar">
        If this site gets blocked, our next link is: dashgames1.github.io
    </div>

    <header>
        <div class="logo">🕹️ DashGames0</div>
    </header>

    <div class="grid">
        <!-- BIG POKI-STYLE FEATURED TILE -->
        <a href="https://gamedistribution.com" class="tile big" style="background-image: url('https://unsplash.com');">
            <span>Tetris Retro</span>
        </a>

        <!-- STANDARD TILES (Pointing directly to full-screen games) -->
        <a href="https://gamedistribution.com" class="tile" style="background-image: url('https://unsplash.com');">
            <span>Space Orbit</span>
        </a>
        <a href="https://gamedistribution.com" class="tile" style="background-image: url('https://unsplash.com');">
            <span>Block Collapse</span>
        </a>
        <a href="https://gamedistribution.com" class="tile" style="background-image: url('https://unsplash.com');">
            <span>Cyber Gunner</span>
        </a>
        <a href="https://gamedistribution.com" class="tile" style="background-image: url('https://unsplash.com');">
            <span>Runner 3D</span>
        </a>
    </div>

</body>
</html>
