<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashGames0 | Fully Automated Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0c10; color: #fff; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #1f2833; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; color: #4630f5; text-transform: uppercase; letter-spacing: 1px; }
        .counter { background: #333; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #00ffff; }

        /* Poki-Style Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 1400px; margin: 0 auto; }
        
        /* Interactive Game Tiles */
        .tile { background-color: #1f2833; aspect-ratio: 1; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; padding: 10px; text-decoration: none; color: white; font-weight: bold; font-size: 12px; transition: transform 0.2s, border-color 0.2s; background-size: cover; background-position: center; border: 2px solid transparent; cursor: pointer; }
        .tile:hover { transform: scale(1.06); border-color: #4630f5; box-shadow: 0 5px 15px rgba(70, 48, 245, 0.4); }
        .tile span { background: rgba(0, 0, 0, 0.75); width: 100%; text-align: center; padding: 5px 0; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Dynamic Large Tiles (Poki Aesthetic) */
        .tile:nth-child(8n) { grid-column: span 2; grid-row: span 2; font-size: 14px; }

        /* Full Screen Theater Overlay */
        .theater { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.98); z-index: 1000; flex-direction: column; }
        .theater-header { background: #1f2833; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .close-btn { background: #ff007f; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        
        .stage { display: flex; flex: 1; padding: 20px; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%; height: calc(100vh - 80px); }
        iframe { flex: 3; height: 100%; border: none; border-radius: 12px; background: #000; }
        .sidebar-ad { flex: 1; background: #151515; border: 2px dashed #333; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #555; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🕹️ DashGames0</div>
        <div class="counter" id="gameCount">Connecting to Network...</div>
    </header>

    <div class="grid" id="arcadeGrid"></div>

    <!-- Theater Mode Overlay Container -->
    <div id="gameTheater" class="theater">
        <div class="theater-header">
            <h2 id="currentGameTitle">Playing</h2>
            <button class="close-btn" onclick="closeGame()">❌ Close Game</button>
        </div>
        <div class="stage">
            <iframe id="gameIframe" src=""></iframe>
            <div class="sidebar-ad">Vertical Ad Space</div>
        </div>
    </div>

    <script>
        // 🚀 THE UNBLOCKED HACK: The gaming feed is wrapped inside a clean developer proxy
        const rawFeedUrl = 'https://gamedistribution.com';
        const unblockedProxyUrl = 'https://allorigins.win' + encodeURIComponent(rawFeedUrl);

        async function fetchAutomatedCatalog() {
            try {
                const response = await fetch(unblockedProxyUrl);
                const proxyData = await response.json();
                
                // Parse the hidden data out of the proxy envelope
                const games = JSON.parse(proxyData.contents);
                
                const grid = document.getElementById('arcadeGrid');
                document.getElementById('gameCount').innerText = `${games.length} Games Online`;

                // Automatically loop and build hundreds of tiles instantly
                games.forEach(game => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.style.backgroundImage = `url('${game.Asset}')`;
                    tile.onclick = () => launchTheater(game.Url, game.Title);
                    
                    const label = document.createElement('span');
                    label.innerText = game.Title;
                    
                    tile.appendChild(label);
                    grid.appendChild(tile);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('gameCount').innerText = 'Connection Error';
            }
        }

        function launchTheater(url, title) {
            document.getElementById('gameIframe').src = url;
            document.getElementById('currentGameTitle').innerText = title;
            document.getElementById('gameTheater').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameTheater').style.display = 'none';
            document.getElementById('gameIframe').src = '';
        }

        fetchAutomatedCatalog();
    </script>

</body>
</html>
