
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111b">
  <title>DashGames0 — Play Free Games</title>
  <style>
    :root {
      --bg: #10111b;
      --panel: #1b1d2b;
      --panel-hover: #282b40;
      --text: #f7f7ff;
      --muted: #a5a7bd;
      --accent: #a58bff;
      --pink: #ff78bc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #151623f5;
      border-bottom: 1px solid #ffffff12;
      padding: 16px max(20px, calc((100% - 1400px) / 2));
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo span { color: var(--accent); }

    .search {
      flex: 1;
      min-width: 80px;
      padding: 12px 16px;
      color: white;
      background: var(--panel);
      border: 1px solid #ffffff12;
      border-radius: 12px;
      outline: none;
    }

    .search:focus { border-color: var(--accent); }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 28px 22px 60px;
    }

    .hero {
      padding: 36px;
      border-radius: 24px;
      background: linear-gradient(120deg, #352767, #6b397c 55%, #a44478);
      margin-bottom: 30px;
      overflow: hidden;
    }

    .hero .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .8;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 52px);
      margin: 10px 0;
      letter-spacing: -2px;
    }

    .hero p {
      color: #eee6ff;
      margin: 0;
      max-width: 500px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 28px 0 16px;
    }

    .section-heading h2 {
      font-size: 21px;
      margin: 0;
    }

    .filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 2px 1px 12px;
    }

    .filter {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 30px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid transparent;
    }

    .filter:hover, .filter.active {
      color: white;
      background: #42336f;
      border-color: #9a7bff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 16px;
    }

    .tile {
      min-width: 0;
      padding: 0;
      overflow: hidden;
      text-align: left;
      color: white;
      background: var(--panel);
      border: 1px solid #ffffff0d;
      border-radius: 16px;
      transition: transform .18s, background .18s;
    }

    .tile:hover {
      transform: translateY(-5px);
      background: var(--panel-hover);
    }

    .cover {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      font-size: 62px;
      background: var(--cover, linear-gradient(135deg,#5742a5,#cf5d9d));
    }

    .tile-info { padding: 12px; }

    .tile-info h3 {
      font-size: 14px;
      margin: 0 0 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-info p {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .empty {
      padding: 50px 15px;
      text-align: center;
      color: var(--muted);
      display: none;
    }

    footer {
      border-top: 1px solid #ffffff12;
      padding: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* Game player */
    .player {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      background: #0b0c12;
    }

    .player.open { display: flex; }

    .player-bar {
      min-height: 66px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
    }

    .player-title {
      font-size: 17px;
      font-weight: 800;
    }

    .player-actions { display: flex; gap: 8px; }

    .player-actions button, .player-actions a {
      display: inline-block;
      text-decoration: none;
      padding: 10px 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #34364b;
    }

    .player-actions .close { background: #c43c70; }

    .game-area {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .game-area iframe {
      width: min(100%, 1100px);
      height: 100%;
      border: 0;
      border-radius: 12px;
      background: #171827;
    }

    .player-note {
      padding: 8px 16px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      header { flex-wrap: wrap; }
      .search { order: 3; flex-basis: 100%; }
    }

    @media (max-width: 600px) {
      main { padding: 18px 14px 40px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .hero { padding: 25px 20px; }
      .count { display: none; }
      .logo { font-size: 20px; }
      .player-bar { padding: 10px; }
      .player-title { font-size: 14px; }
      .player-actions button, .player-actions a {
        padding: 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#" style="color:inherit;text-decoration:none">
      🕹️ Dash<span>Games0</span>
    </a>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Search games..."
      aria-label="Search games"
    >

    <div class="count" id="count">Loading games...</div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Your next favorite game</div>
      <h1>Ready. Set. Play.</h1>
      <p>Discover games, try something new, and have fun.</p>
    </section>

    <div class="section-heading">
      <h2>Explore games</h2>
    </div>

    <nav class="filters" id="filters" aria-label="Game categories"></nav>

    <section class="grid" id="grid" aria-label="Games"></section>

    <div class="empty" id="empty">
      <h3>No games found</h3>
      <p>Try another search or category.</p>
    </div>
  </main>

  <footer>
    DashGames0 · Made for players 🎮
  </footer>

  <section
    class="player"
    id="player"
    role="dialog"
    aria-modal="true"
    aria-label="Game player"
  >
    <div class="player-bar">
      <div class="player-title" id="playerTitle">Playing</div>
      <div class="player-actions">
        <a id="externalLink" href="#" target="_blank"
           rel="noopener noreferrer" hidden>Open in new tab ↗</a>
        <button id="fullscreen">⛶ Fullscreen</button>
        <button class="close" id="close">✕ Close</button>
      </div>
    </div>

    <div class="game-area" id="gameArea"></div>
    <div class="player-note" id="playerNote">
      Having trouble? Try opening the game in a new tab.
    </div>
  </section>

  <script>
    /*
      Add games to this list.

      type: "built-in" means the game runs on this website.
      type: "external" means the game is hosted elsewhere.

      External games may block iframe embedding. Use a real,
      playable game URL, not just a catalog or publisher homepage.
    */

    const games = [
      {
        title: "Neon Dodger",
        category: "Arcade",
        emoji: "⚡",
        color: "linear-gradient(135deg,#27256f,#d13c91)",
        type: "built-in",
        description: "Dodge the falling blocks!"
      },

      /*
      Example for adding an external game:

      {
        title: "My Browser Game",
        category: "Action",
        emoji: "🚀",
        color: "linear-gradient(135deg,#126e82,#51c4d3)",
        type: "external",
        url: "https://YOUR-ACTUAL-PLAYABLE-GAME-URL"
      },
      */
    ];

    const categories = [
      "All", "Arcade", "Action", "Puzzle",
      "Racing", "Sports", "Adventure"
    ];

    let selectedCategory = "All";

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const filters = document.getElementById("filters");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");
    const player = document.getElementById("player");
    const gameArea = document.getElementById("gameArea");
    const playerTitle = document.getElementById("playerTitle");
    const externalLink = document.getElementById("externalLink");

    function renderFilters() {
      filters.replaceChildren();

      categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "filter" +
          (selectedCategory === category ? " active" : "");
        button.textContent = category;
        button.onclick = () => {
          selectedCategory = category;
          renderFilters();
          renderGames();
        };
        filters.appendChild(button);
      });
    }

    function renderGames() {
      const query = search.value.trim().toLowerCase();

      const visibleGames = games.filter(game => {
        const matchesSearch =
          game.title.toLowerCase().includes(query) ||
          game.category.toLowerCase().includes(query);

        const matchesCategory =
          selectedCategory === "All" ||
          game.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      grid.replaceChildren();
      count.textContent = `${visibleGames.length} games`;

      visibleGames.forEach(game => {
        const tile = document.createElement("button");
        tile.className = "tile";
        tile.type = "button";

        const cover = document.createElement("div");
        cover.className = "cover";
        cover.style.setProperty(
          "--cover",
          game.color || "linear-gradient(135deg,#5742a5,#cf5d9d)"
        );
        cover.textContent = game.emoji || "🎮";

        const info = document.createElement("div");
        info.className = "tile-info";

        const title = document.createElement("h3");
        title.textContent = game.title;

        const category = document.createElement("p");
        category.textContent = game.category;

        info.append(title, category);
        tile.append(cover, info);
        tile.onclick = () => launchGame(game);

        grid.appendChild(tile);
      });

      empty.style.display = visibleGames.length ? "none" : "block";
    }

    // This is a small game hosted directly by the website.
    // It requires no third-party game server or API.
    const neonDodgerHTML = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
          * { box-sizing:border-box; }
          body {
            margin:0; background:#111124; color:white;
            font-family:system-ui,sans-serif;text-align:center;
          }
          h2 { margin:12px 0 4px; }
          p { margin:4px 0 10px;color:#c6c4e8;font-size:14px; }
          canvas {
            display:block; width:min(94%,700px); height:auto;
            margin:0 auto; border:2px solid #755bff;
            border-radius:12px; background:#17172e;
            touch-action:none;
          }
          button {
            margin:10px;padding:10px 20px;border:0;
            border-radius:8px;background:#9a7bff;
            color:white;font-weight:bold;
          }
        </style>
      </head>
      <body>
        <h2>⚡ Neon Dodger</h2>
        <p>Move with ← → or A / D. On mobile, drag your finger.</p>
        <canvas id="c" width="700" height="420"></canvas>
        <div id="status">Dodge the blocks. Don't get hit!</div>
        <button id="start">Start / Restart</button>

        <script>
          const c = document.getElementById('c');
          const ctx = c.getContext('2d');
          const status = document.getElementById('status');
          let player, blocks, score, running, keys, frame, animation;
          keys = {};

          function reset() {
            player = {x:330,y:370,w:40,h:24};
            blocks = [];
            score = 0;
            frame = 0;
            running = true;
            status.textContent = 'Score: 0';
            cancelAnimationFrame(animation);
            draw();
          }

          document.getElementById('start').onclick = reset;

          window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (['ArrowLeft','ArrowRight',' '].includes(e.key))
              e.preventDefault();
          });

          window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
          });

          function moveTo(e) {
            const rect = c.getBoundingClientRect();
            const x = (e.clientX - rect.left) * c.width / rect.width;
            player.x = Math.max(0, Math.min(c.width-player.w, x-player.w/2));
          }

          c.addEventListener('pointerdown', e => {
            c.setPointerCapture(e.pointerId);
            moveTo(e);
          });
          c.addEventListener('pointermove', e => {
            if (e.buttons) moveTo(e);
          });

          function draw() {
            ctx.clearRect(0,0,c.width,c.height);
            ctx.fillStyle = '#17172e';
            ctx.fillRect(0,0,c.width,c.height);

            if (running) {
              frame++;
              if (keys['arrowleft'] || keys['a']) player.x -= 6;
              if (keys['arrowright'] || keys['d']) player.x += 6;
              player.x = Math.max(0,Math.min(c.width-player.w,player.x));

              if (frame % 27 === 0) {
                blocks.push({
                  x:Math.random()*(c.width-30),
                  y:-30,w:20+Math.random()*24,h:20,
                  speed:2.5+Math.random()*2.5
                });
              }

              blocks.forEach(b => b.y += b.speed);
              blocks = blocks.filter(b => b.y < c.height+30);
              score++;

              for (const b of blocks) {
                if (
                  player.x < b.x+b.w &&
                  player.x+player.w > b.x &&
                  player.y < b.y+b.h &&
                  player.y+player.h > b.y
                ) {
                  running = false;
                  status.textContent = 'Game over! Score: ' +
                    Math.floor(score/6) + '. Press restart to try again.';
                }
              }
            }

            ctx.fillStyle = '#8b79ff';
            ctx.fillRect(player.x,player.y,player.w,player.h);

            ctx.fillStyle = '#ff69b4';
            blocks.forEach(b => ctx.fillRect(b.x,b.y,b.w,b.h));

            if (running) {
              status.textContent = 'Score: ' + Math.floor(score/6);
              animation = requestAnimationFrame(draw);
            }
          }

          reset();
        <\/script>
      </body>
      </html>
    `;

    function launchGame(game) {
      player.classList.add("open");
      document.body.style.overflow = "hidden";
      playerTitle.textContent = game.title;
      gameArea.replaceChildren();

      externalLink.hidden = game.type !== "external";
      externalLink.href = game.type === "external" ? game.url : "#";

      const frame = document.createElement("iframe");
      frame.title = game.title;
      frame.allow = "fullscreen; gamepad";
      frame.allowFullscreen = true;

      if (game.type === "built-in") {
        frame.srcdoc = neonDodgerHTML;
        document.getElementById("playerNote").textContent =
          "Tip: Use the arrow keys, A / D, or drag on the game.";
      } else if (game.type === "external" && game.url) {
        frame.src = game.url;
        document.getElementById("playerNote").textContent =
          "If this game does not load, use Open in new tab.";
      } else {
        return;
      }

      gameArea.appendChild(frame);
    }

    function closeGame() {
      player.classList.remove("open");
      gameArea.replaceChildren();
      document.body.style.overflow = "";
    }

    document.getElementById("close").onclick = closeGame;

    document.getElementById("fullscreen").onclick = () => {
      const frame = gameArea.querySelector("iframe");
      if (!frame) return;

      if (frame.requestFullscreen) {
        frame.requestFullscreen().catch(() => {
          alert("Fullscreen isn't available in this browser.");
        });
      }
    };

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeGame();
    });

    search.addEventListener("input", renderGames);

    renderFilters();
    renderGames();
  </script>
</body>
</html>
